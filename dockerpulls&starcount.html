<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Live Stats - Pulls & Stars Counter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="https://docker.com/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #334155 50%, #475569 75%, #64748b 100%);
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* Docker-themed gradient overlay */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 1s ease-out;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .docker-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2496ed, #0db7ed);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(36, 150, 237, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 32px;
        }

        /* Main card */
        .main-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 600px;
            box-shadow: 
                0 32px 64px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .card-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .card-title {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Search section */
        .search-container {
            position: relative;
            margin-bottom: 32px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 20px 24px;
            padding-right: 120px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .search-button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        .search-button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-50%) scale(1.02);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .search-button:active {
            transform: translateY(-50%) scale(0.98);
        }

        /* Results section */
        .results-container {
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .badge-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            animation: fadeInUp 0.6s ease-out;
        }

        .badge-wrapper {
            position: relative;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .badge-wrapper:hover {
            transform: scale(1.05);
        }

        .badge-wrapper img {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .error-message {
            color: #ef4444;
            font-weight: 600;
            text-align: center;
            padding: 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .footer-text {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom cursor */
        .target-cursor {
            width: 24px;
            height: 24px;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.8);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: all 0.1s ease;
            backdrop-filter: blur(4px);
        }

        .target-cursor.clicking {
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(59, 130, 246, 0.4);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }

            .main-card {
                padding: 32px 24px;
                margin: 20px;
            }

            .search-input {
                padding-right: 24px;
                margin-bottom: 16px;
            }

            .search-button {
                position: static;
                transform: none;
                width: 100%;
                justify-content: center;
            }

            .search-wrapper {
                flex-direction: column;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 2rem;
            }

            .container {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="background-overlay"></div>
    <div class="target-cursor"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="docker-logo">
                    <i class="fab fa-docker" style="font-size: 24px; color: white;"></i>
                </div>
            </div>
            <h1 class="main-title">Docker Live Stats</h1>
            <p class="subtitle">Real-time pulls and stars counter for Docker repositories</p>
        </div>

        <div class="main-card">
            <div class="card-header">
                <h2 class="card-title">Repository Statistics</h2>
                <p class="card-subtitle">Enter a Docker repository name or URL to view live stats</p>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input"
                        placeholder="e.g., nginx, library/ubuntu, or full Docker Hub URL"
                        autocomplete="off"
                    >
                    <button class="search-button" onclick="searchDockerStats()" id="searchButton">
                        <i class="fas fa-search"></i>
                        Search
                    </button>
                </div>
            </div>

            <div class="results-container">
                <div id="badgeContainer"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-text">
                <i class="fas fa-heart" style="color: #ef4444; margin-right: 8px;"></i>
                Developed by Yashawanth R
            </div>
        </div>
    </div>

    <script>
        // Create animated particles
        function createParticles() {
            const particles = document.querySelector('.particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
            }
        }

        // Enhanced cursor with click effect
        const targetCursor = document.querySelector('.target-cursor');
        let isClicking = false;

        document.addEventListener('mousemove', (e) => {
            targetCursor.style.left = e.clientX + 'px';
            targetCursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            isClicking = true;
            targetCursor.classList.add('clicking');
        });

        document.addEventListener('mouseup', () => {
            isClicking = false;
            targetCursor.classList.remove('clicking');
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                searchDockerStats();
            }
        });

        function showLoading() {
            const searchButton = document.getElementById('searchButton');
            searchButton.innerHTML = '<div class="loading"></div>';
            searchButton.disabled = true;
        }

        function hideLoading() {
            const searchButton = document.getElementById('searchButton');
            searchButton.innerHTML = '<i class="fas fa-search"></i> Search';
            searchButton.disabled = false;
        }

        function showError(message) {
            const badgeContainer = document.getElementById('badgeContainer');
            badgeContainer.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> ${message}</div>`;
        }

        function searchDockerStats() {
            const searchInput = document.getElementById('searchInput').value;
            const badgeContainer = document.getElementById('badgeContainer');

            if (searchInput.trim() === '') {
                showError('Please enter a Docker repository name or URL');
                return;
            }

            showLoading();

            let repoName;
            if (searchInput.startsWith('https://hub.docker.com/')) {
                const urlParts = searchInput.split('/');
                repoName = urlParts.slice(-2).join('/');
            } else {
                repoName = searchInput;
            }

            // Create badge URLs
            const pullsBadgeUrl = `https://img.shields.io/docker/pulls/${repoName}?style=for-the-badge&logo=docker&logoColor=white&color=2496ED`;
            const starsBadgeUrl = `https://img.shields.io/docker/stars/${repoName}?style=for-the-badge&logo=docker&logoColor=white&color=2496ED`;

            // Test if badges load successfully
            Promise.all([
                new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(pullsBadgeUrl);
                    img.onerror = reject;
                    img.src = pullsBadgeUrl;
                }),
                new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(starsBadgeUrl);
                    img.onerror = reject;
                    img.src = starsBadgeUrl;
                })
            ])
            .then(([pullsUrl, starsUrl]) => {
                badgeContainer.innerHTML = `
                    <div class="badge-container">
                        <div class="badge-wrapper">
                            <img src="${pullsUrl}" alt="Docker Pulls" style="height: 32px;">
                        </div>
                        <div class="badge-wrapper">
                            <img src="${starsUrl}" alt="Docker Stars" style="height: 32px;">
                        </div>
                    </div>
                `;
                hideLoading();
            })
            .catch(error => {
                console.error('Error loading badges:', error);
                hideLoading();
                showError('Repository not found or invalid. Please check the name and try again.');
            });
        }

        // Initialize particles and focus input on load
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            searchInput.focus();
        });

        // Add smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
    </script>
</body>
</html>
